<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Kachoo Guestbook</title>
  <!-- Inter font + Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #d9d9d9 0%, #f0f0f0 100%);
      font-family: 'Inter', 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      color: #000;
    }

    /* ===== CONTAINER GLASS BLEAM PUTIH ===== */
    .glass-card {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px) saturate(200%);
      -webkit-backdrop-filter: blur(20px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 60px;
      padding: 2.5rem 2.5rem;
      box-shadow: 0 25px 50px -15px rgba(0,0,0,0.2), inset 0 1px 3px rgba(255,255,255,0.9);
      transition: box-shadow 0.3s, border-color 0.3s;
      animation: cardAppear 0.8s ease-out;
      color: #000;
    }

    @keyframes cardAppear {
      0% { opacity: 0; transform: scale(0.97) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .glass-card:hover {
      border-color: rgba(255,255,255,0.9);
      box-shadow: 0 35px 70px -15px rgba(0,0,0,0.25), inset 0 1px 4px white;
    }

    /* HEADER GUESTBOOK */
    .guestbook-header {
      text-align: center;
      margin-bottom: 2rem;
      animation: slideDown 0.7s ease-out;
    }

    @keyframes slideDown {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .guestbook-header h1 {
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      font-weight: 800;
      letter-spacing: -1.5px;
      color: #000;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .guestbook-header p {
      font-size: 1.1rem;
      font-weight: 300;
      color: #444;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      display: inline-block;
      padding-bottom: 0.4rem;
    }

    /* grid dua kolom: form (kiri) + daftar tamu (kanan) */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2rem;
      margin: 1.8rem 0 2rem;
    }

    /* FORM SECTION */
    .form-section {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 40px;
      padding: 1.8rem 1.8rem;
      border: 1px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      transition: 0.3s;
      animation: fadeIn 0.8s ease;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.1);
    }

    .guestlist-section {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 40px;
      padding: 1.8rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.8);
      backdrop-filter: blur(5px);
      transition: 0.3s;
      animation: fadeIn 0.8s ease;
      box-shadow: 0 10px 25px -10px rgba(0,0,0,0.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-section:hover, .guestlist-section:hover {
      background: rgba(255, 255, 255, 0.8);
      border-color: white;
      box-shadow: 0 15px 30px -12px rgba(0,0,0,0.15);
    }

    .form-section h2, .guestlist-section h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #000;
      margin-bottom: 1.5rem;
      letter-spacing: -0.3px;
      border-left: 4px solid #000;
      padding-left: 1rem;
    }

    /* TIGA TOMBOL PILIHAN */
    .tombol-pilihan {
      margin-bottom: 1.8rem;
    }
    .tombol-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #444;
      margin-bottom: 0.5rem;
      display: block;
    }
    .btn-group-tiga {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .option-btn {
      flex: 1;
      min-width: 105px;
      background: white;
      border: 1px solid rgba(0,0,0,0.2);
      padding: 0.75rem 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 60px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
      color: #000;
      text-align: center;
    }
    .option-btn.active {
      background: #000000;
      border-color: #000000;
      color: white;
      box-shadow: 0 6px 12px -6px rgba(0,0,0,0.2);
    }
    .option-btn:not(.active):hover {
      background: #e6e6e6;
      border-color: #000;
    }

    /* ===== DAFTAR NAMA TAMU VIP (Container List) ===== */
    .guest-category {
      margin-bottom: 1.6rem;
    }
    .guest-category:last-child {
      margin-bottom: 0;
    }
    .category-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #000;
      background: rgba(0,0,0,0.05);
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      margin-bottom: 0.7rem;
      text-transform: uppercase;
      border: 0.5px solid rgba(0,0,0,0.1);
    }
    .guest-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.4rem 0.9rem;
    }
    .invitee-item {
      font-size: 0.9rem;
      font-weight: 400;
      color: #222;
      padding: 0.35rem 0;
      border-bottom: 1px dotted rgba(0,0,0,0.12);
      transition: 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .invitee-item:hover {
      color: #000;
      border-bottom-color: #000;
      padding-left: 4px;
    }

    /* scroll area untuk seluruh guest list jika terlalu panjang */
    .guestlist-scroll {
      max-height: 480px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .guestlist-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .guestlist-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 10px;
    }
    .guestlist-scroll::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
    }

    /* form fields */
    .field {
      margin-bottom: 1.5rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #444;
      margin-bottom: 0.4rem;
      transition: 0.2s;
    }

    .required-star {
      color: #c00;
      font-size: 1rem;
      margin-left: 2px;
    }

    .field input {
      width: 100%;
      background: white;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 50px;
      padding: 0.9rem 1.4rem;
      font-size: 1rem;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      transition: 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .field input:focus {
      outline: none;
      border-color: #000;
      background: #ffffff;
      transform: scale(1.01);
      box-shadow: 0 8px 20px -12px rgba(0,0,0,0.2);
    }

    .field input::placeholder {
      color: #aaa;
      font-weight: 300;
    }

    .field:hover label {
      color: #000;
    }

    /* tombol sign */
    .sign-btn {
      background: #000;
      border: none;
      color: white;
      font-weight: 700;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #000;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      box-shadow: 0 8px 20px -8px rgba(0,0,0,0.3);
      overflow: hidden;
      position: relative;
    }

    .sign-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .sign-btn:hover::before {
      width: 400px;
      height: 400px;
    }

    .sign-btn:hover {
      background: #222;
      transform: scale(0.98);
      box-shadow: 0 12px 30px -8px rgba(0,0,0,0.4);
    }

    .feedback-message {
      margin-top: 1rem;
      font-size: 0.85rem;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      text-align: center;
      background: white;
      border: 1px solid rgba(0,0,0,0.1);
      color: #000;
      display: none;
    }

    /* KETERANGAN BAHASA INGGRIS: VIP juga harus mengisi formulir */
    .vip-form-notice {
      background: rgba(0,0,0,0.04);
      border-left: 3px solid #000;
      padding: 0.9rem 1rem;
      border-radius: 20px;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2b2b2b;
    }
    .vip-form-notice strong {
      color: #000;
    }

    /* ROLEPLAY BANNER - tanpa icon/simbol */
    .roleplay-footer {
      margin-top: 2rem;
      padding: 1.2rem 0 0.2rem;
      border-top: 1px solid rgba(0,0,0,0.1);
      text-align: center;
    }

    .roleplay-text {
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .kachoo-brand {
      font-size: 2rem;
      font-weight: 700;
      color: #000;
      letter-spacing: -0.3px;
      display: inline-block;
      position: relative;
    }

    .kachoo-brand::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      background: #000;
      bottom: -4px;
      left: 0;
      transform: scaleX(0);
      transition: transform 0.3s;
    }

    .roleplay-footer:hover .kachoo-brand::after {
      transform: scaleX(1);
    }

    /* back to lobby */
    .back-lobby {
      text-align: right;
      margin-top: 1.5rem;
    }

    .back-lobby a {
      display: inline-block;
      color: #333;
      text-decoration: none;
      font-weight: 400;
      padding: 0.5rem 1.8rem;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 60px;
      transition: 0.2s;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(4px);
    }

    .back-lobby a:hover {
      background: #000;
      color: white;
      border-color: #000;
      transform: translateX(-3px);
    }

    /* notifikasi thank you - tanpa simbol */
    .notif-thanks {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      font-weight: 800;
      font-size: 2rem;
      padding: 1.5rem 3rem;
      border-radius: 70px;
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      z-index: 9999;
      animation: notifPop 1.4s ease forwards;
      white-space: nowrap;
      letter-spacing: -0.5px;
      text-align: center;
    }

    @keyframes notifPop {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.8); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -70%) scale(0.9); }
    }

    /* ===== RESPONSIVE MOBILE ===== */
    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .guestlist-scroll {
        max-height: 380px;
      }
      .btn-group-tiga .option-btn {
        min-width: 90px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 1rem;
        align-items: flex-start;
        padding-top: 2rem;
        padding-bottom: 2rem;
      }

      .glass-card {
        padding: 1.5rem 1.2rem;
        border-radius: 40px;
      }

      .dashboard {
        gap: 1.2rem;
        margin: 1.2rem 0;
      }

      .form-section, .guestlist-section {
        padding: 1.5rem 1.2rem;
        border-radius: 32px;
      }

      .form-section h2, .guestlist-section h2 {
        font-size: 1.4rem;
        margin-bottom: 1rem;
      }

      .guest-grid {
        grid-template-columns: 1fr;
        gap: 0.2rem;
      }

      .invitee-item {
        font-size: 0.88rem;
        white-space: normal;
        overflow: visible;
        padding: 0.4rem 0;
      }
      .category-title {
        font-size: 0.9rem;
        margin-top: 0.2rem;
      }
      .guest-category {
        margin-bottom: 1.2rem;
      }
      .field input {
        padding: 0.8rem 1.2rem;
      }

      .sign-btn {
        padding: 0.9rem 1rem;
      }

      .roleplay-text {
        font-size: 0.9rem;
        letter-spacing: 2px;
      }

      .kachoo-brand {
        font-size: 1.8rem;
      }

      .back-lobby {
        text-align: center;
        margin-top: 1.5rem;
      }
      
      .back-lobby a {
        padding: 0.5rem 2rem;
        font-size: 0.9rem;
      }

      .notif-thanks {
        font-size: 1.6rem;
        padding: 1rem 2rem;
        white-space: normal;
        text-align: center;
        width: 80%;
      }
      .btn-group-tiga {
        flex-direction: row;
        gap: 0.6rem;
      }
    }

    @media (max-width: 480px) {
      .btn-group-tiga {
        flex-direction: column;
        gap: 0.5rem;
      }
      .option-btn {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <!-- HEADER -->
    <div class="guestbook-header">
      <h1>GUESTBOOK</h1>
      <p>Sign the attendance</p>
    </div>

    <!-- GRID: FORM SIGN + GUEST LIST -->
    <div class="dashboard">
      <!-- FORM SECTION dengan 3 tombol pilihan -->
      <div class="form-section">
        <h2>Sign here</h2>
        
        <!-- Tiga tombol pilihan: Kachoo Team, VIP Guest, Guest -->
        <div class="tombol-pilihan">
          <span class="tombol-label">SELECT YOUR TYPE</span>
          <div class="btn-group-tiga">
            <button type="button" class="option-btn" data-tipe="kachoo">Kachoo Team</button>
            <button type="button" class="option-btn" data-tipe="vip">VIP Guest</button>
            <button type="button" class="option-btn" data-tipe="guest">Guest</button>
          </div>
        </div>

        <div class="field">
          <label>Name <span class="required-star">*</span></label>
          <input type="text" id="fullNameInput" placeholder="Enter your full name" autocomplete="off">
        </div>
        <div class="field">
          <label>Part of</label>
          <input type="text" id="affiliationInput" placeholder="e.g. Community / Agency / Company (optional)" autocomplete="off">
        </div>
        <button class="sign-btn" id="signGuestbookBtn">Sign guestbook</button>
        <div id="formFeedback" class="feedback-message"></div>
      </div>

      <!-- GUEST LIST SECTION: Daftar nama VIP Guest (Container List) + keterangan dalam bahasa Inggris -->
      <div class="guestlist-section">
        <h2>Guest List</h2>
        <div class="guestlist-scroll" id="guestlistContainer"></div>
        <!-- Keterangan dalam bahasa Inggris: tamu VIP juga harus mengisi formulir -->
        <div class="vip-form-notice">
          <strong>VIP GUEST NOTICE</strong> · VIP guests listed above are also required to fill out the form. Please select "VIP Guest" and complete your details.
        </div>
      </div>
    </div>

    <!-- ROLEPLAY BANNER tanpa simbol -->
    <div class="roleplay-footer">
      <div class="roleplay-text">For Roleplay Purpose Only</div>
      <div class="kachoo-brand">by The Kachoo</div>
    </div>

    <!-- BACK TO LOBBY -->
    <div class="back-lobby">
      <a href="Lobby.html" id="backToLobby">Back to Lobby</a>
    </div>
  </div>

      // VVIP GUEST dan VIP GUEST digabung sesuai permintaan "nama tamu VIP bisa cek dibawah"

        "Gathur Delano Kafka",

      ];

      // DOM elements
      const guestContainer = document.getElementById('guestlistContainer');
      const fullNameInput = document.getElementById('fullNameInput');
      const affiliationInput = document.getElementById('affiliationInput');
      const signBtn = document.getElementById('signGuestbookBtn');
      const feedback = document.getElementById('formFeedback');
      
      // State untuk tombol pilihan
      let selectedRole = 'guest'; // default: Guest
      const roleBtns = document.querySelectorAll('.option-btn');
      
      // Fungsi update active class pada tombol
      function updateActiveRole(role) {
        roleBtns.forEach(btn => {
          const btnRole = btn.getAttribute('data-tipe');
          if (btnRole === role) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        selectedRole = role;
      }
      
      // Event listener untuk tombol pilihan
      roleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const role = btn.getAttribute('data-tipe');
          updateActiveRole(role);
        });
      });
      
      // Set default active (Guest)
      updateActiveRole('guest');
      
      // Helper escape html
      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
      }
      
      // Render daftar nama VIP (Container List) dan tambahan Kachoo Team jika ingin (tetap tampilkan sesuai kebutuhan)
      // sesuai permintaan: "Container List nama" untuk tamu VIP.
      function renderGuestList() {
        let html = `
          <div class="guest-category">
            <div class="category-title">VIP GUEST LIST</div>
            <div class="guest-grid" id="vipGrid">
        `;
        vipNamesList.forEach(name => {
          html += `<div class="invitee-item">${escapeHtml(name)}</div>`;
        });
        html += `</div></div>`;
        
        // Opsional: tambahkan Kachoo Team sebagai informasi pelengkap (tidak mengganggu)
        html += `
          <div class="guest-category">
            <div class="category-title">KACHOO TEAMS</div>
            <div class="guest-grid" id="teamGrid">
        `;
        kachooTeamsList.forEach(team => {
          html += `<div class="invitee-item">${escapeHtml(team)}</div>`;
        });
        html += `</div></div>`;
        
        guestContainer.innerHTML = html;
      }
      
      // Fungsi submit ke Google Sheets (tidak diubah, sistem tetap sama)
      async function submitToSheet(name, partOf, roleCategory) {
        const url = 'https://script.google.com/macros/s/AKfycbx7wCCX6vDbg_d_3_97fSB-k1lFiOeUwYJvvxToDGUQnJzawGSqxMK-ex-P3aVlqo93/exec';
        const affiliationValue = partOf.trim() === "" ? "-" : partOf.trim();
        // tambahkan roleCategory ke payload (opsional untuk log, namun tidak mengganggu)
        const payload = new URLSearchParams({ 
          fullname: name, 
          username: affiliationValue,
          role: roleCategory
        });
        try {
          await fetch(url, { method: 'POST', mode: 'no-cors', body: payload });
        } catch (e) {
          console.warn("Fetch error (network):", e);
        }
      }
      
      // Notifikasi Thank you + redirect ke GH.html
      function showThankYouAndRedirect() {
        const notif = document.createElement('div');
        notif.className = 'notif-thanks';
        notif.textContent = 'Thank you';
        document.body.appendChild(notif);
        setTimeout(() => {
          window.location.href = 'https://thekachoo.github.io/Games/Fotoduluyuk.html';
        }, 1400);
      }
      
      // Handle sign
      async function handleSign() {
        const name = fullNameInput.value.trim();
        const partOf = affiliationInput.value.trim();
        
        if (!name) {
          feedback.style.display = 'block';
          feedback.textContent = 'Name is required. Please enter your name.';
          feedback.style.background = '#fee';
          feedback.style.color = '#c00';
          setTimeout(() => {
            feedback.style.display = 'none';
          }, 2500);
          return;
        }
        
        signBtn.disabled = true;
        const originalText = signBtn.textContent;
        signBtn.textContent = 'Sending...';
        
        // Kirim data ke sheet dengan role yang dipilih
        await submitToSheet(name, partOf, selectedRole);
        showThankYouAndRedirect();
        
        fullNameInput.value = '';
        affiliationInput.value = '';
        signBtn.disabled = false;
        signBtn.textContent = originalText;
      }
      
      // Event listeners
      signBtn.addEventListener('click', handleSign);
      
      const handleEnter = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleSign();
        }
      };
      fullNameInput.addEventListener('keypress', handleEnter);
      affiliationInput.addEventListener('keypress', handleEnter);
      
      // Render daftar tamu VIP (Container List nama)
      renderGuestList();
    })();
  </script>
</body>
